<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="robots"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, max-snippet:0, max-image-preview:none, max-video-preview:0"
    />
    <meta name="description" content="EES Kuyumculuk ozel urun vitrin sitesi." />
    <meta name="theme-color" content="#0c0000" id="metaThemeColor" />
    <script>
      (function () {
        try {
          if (localStorage.getItem("ees-theme") === "light") {
            document.documentElement.classList.add("theme-light");
            var m = document.getElementById("metaThemeColor");
            if (m) m.setAttribute("content", "#ffffff");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
    <link rel="apple-touch-icon" href="/public/favicon.svg" />
    <title>EES Kuyumculuk | Vitrin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/public/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-bar">
        <a class="brand" href="/" data-link aria-label="EES Kuyumculuk anasayfa">
          <span class="brand-mark">
            <img src="/public/logo-ees.svg" alt="EES" />
          </span>
          <span class="brand-name">Kuyumculuk</span>
        </a>

        <nav class="desktop-nav" aria-label="Ana menü">
          <a href="/" data-link>Anasayfa</a>
          <a href="/koleksiyon" data-link>Koleksiyon</a>
          <div id="desktopCategoryNav" class="desktop-category-nav"></div>
        </nav>

        <div class="header-util">
          <button id="menuToggle" class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobileMenu">
            Menü
          </button>
        </div>
      </div>
    </header>

    <div id="mobileMenuBackdrop" class="overlay-backdrop" hidden></div>
    <aside id="mobileMenu" class="mobile-menu" aria-hidden="true" hidden>
      <div class="mobile-menu-head">
        <strong>Menü</strong>
        <button id="closeMobileMenu" class="ghost-btn" type="button">Kapat</button>
      </div>
      <nav class="mobile-main-nav" aria-label="Mobil menü">
        <a href="/" data-link>Anasayfa</a>
        <a href="/koleksiyon" data-link>Koleksiyon</a>
      </nav>
      <p class="mobile-menu-title">Kategoriler</p>
      <div id="mobileCategoryNav" class="mobile-category-nav"></div>
    </aside>

    <main id="app" class="page-root"></main>

    <div id="quickViewBackdrop" class="overlay-backdrop" hidden></div>
    <section id="quickViewModal" class="quickview-modal" aria-hidden="true" hidden>
      <button id="quickViewClose" class="quickview-close" type="button" aria-label="Görseli kapat">×</button>
      <div id="quickViewContent" class="quickview-content"></div>
    </section>

    <div id="filterBackdrop" class="overlay-backdrop" hidden></div>
    <aside id="filterDrawer" class="filter-drawer" aria-hidden="true" hidden>
      <div class="filter-head">
        <h3>Filtreler</h3>
        <button id="closeFilterDrawer" class="ghost-btn" type="button">Kapat</button>
      </div>

      <form id="filterForm" class="filter-form">
        <label>
          Min gram
          <input id="drawerMinGram" type="number" step="0.01" min="0" placeholder="0" />
        </label>
        <label>
          Max gram
          <input id="drawerMaxGram" type="number" step="0.01" min="0" placeholder="50" />
        </label>
        <label>
          Min fiyat (₺)
          <input id="drawerMinPrice" type="number" step="1" min="0" placeholder="0" />
        </label>
        <label>
          Max fiyat (₺)
          <input id="drawerMaxPrice" type="number" step="1" min="0" placeholder="500000" />
        </label>
        <div class="filter-actions">
          <button class="primary-btn" type="submit">Uygula</button>
          <button id="resetFilters" class="secondary-btn" type="button">Sıfırla</button>
        </div>
      </form>
    </aside>

    <script type="module" src="/public/app.js"></script>
  </body>
</html>
